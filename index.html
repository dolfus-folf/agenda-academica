<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda Académica</title>
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado superior -->
  <header class="app-header">
    <div>
      <h1 id="header-title">Hoy</h1>
      <span id="header-date" class="date-badge"></span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-icon" onclick="exportarDatos()" title="Exportar Copia de Seguridad">💾</button>
      <button type="button" class="btn-icon" onclick="document.getElementById('import-file').click()" title="Importar Copia de Seguridad">📂</button>
      <input type="file" id="import-file" style="display:none" accept=".json" onchange="importarDatos(event)">
    </div>
  </header>

  <!-- Contenedor Principal de Vistas -->
  <main class="content-container">

    <!-- VISTA 1: HOY -->
    <section id="view-hoy" class="view active">
      <div class="card-section">
        <h2>Progreso Diario de Entregas</h2>
        <div class="progress-container">
          <div id="daily-progress-bar" class="progress-bar"></div>
        </div>
        <p id="daily-progress-text" class="empty-msg" style="text-align: right; font-size: 0.8rem;">0% completado</p>
      </div>

      <div class="card-section">
        <h2>Clases de Hoy</h2>
        <div id="next-class-card" class="card-list">
          <p class="empty-msg">No hay clases programadas para hoy.</p>
        </div>
      </div>

      <div class="card-section">
        <h2>Entregas Pendientes Hoy</h2>
        <div id="today-tasks-list" class="task-list">
          <p class="empty-msg">¡Todo al día por hoy!</p>
        </div>
      </div>
    </section>

    <!-- VISTA 2: TAREAS -->
    <section id="view-tareas" class="view">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrarTareas('todas')">Todas</button>
        <button class="filter-btn" onclick="filtrarTareas('pendiente')">Pendientes</button>
        <button class="filter-btn" onclick="filtrarTareas('completada')">Completadas</button>
      </div>
      <div id="all-tasks-list" class="task-list"></div>
    </section>

    <!-- VISTA 3: CURSOS -->
    <section id="view-cursos" class="view">
      <div id="courses-list" class="course-grid"></div>
    </section>

    <!-- VISTA 4: NOTAS RÁPIDAS -->
    <section id="view-notas" class="view">
      <div class="quick-note-box">
        <textarea id="quick-note-input" placeholder="Escribe aquí lo que dice el profesor..."></textarea>
        <button class="btn-primary" onclick="guardarNotaRapida()">Guardar Nota</button>
      </div>
      <div id="notes-list" class="notes-list" style="margin-top: 15px;"></div>
    </section>

  </main>

  <!-- Botón Flotante (FAB) -->
  <button id="fab-btn" class="fab" type="button" onclick="abrirModal()">+</button>

  <!-- Modal para Crear Tarea/Curso -->
  <div id="modal-form" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <h2 id="modal-title">Agregar Nuevo</h2>
      
      <div class="modal-tabs">
        <button id="tab-opt-tarea" type="button" class="tab-btn active" onclick="switchFormType('tarea')">Tarea</button>
        <button id="tab-opt-curso" type="button" class="tab-btn" onclick="switchFormType('curso')">Curso</button>
      </div>

      <!-- Formulario Tareas -->
      <form id="form-tarea" onsubmit="guardarTarea(event)">
        <input type="text" id="task-title" placeholder="Título de la entrega" required>
        <select id="task-course">
          <option value="">Selecciona un Curso (Opcional)</option>
        </select>
        <input type="datetime-local" id="task-date" required>
        <button type="submit" class="btn-primary">Guardar Tarea</button>
      </form>

      <!-- Formulario Cursos -->
      <form id="form-curso" class="hidden" onsubmit="guardarCurso(event)">
        <input type="text" id="course-name" placeholder="Nombre de la materia (ej. Sistemas Operativos)" required>
        <input type="text" id="course-room" placeholder="Aula (ej. Lab 204)" required>

        <label style="font-size:0.85rem; color:var(--text-dim); display:block; margin-top:8px;">Días de clase:</label>
        <div class="days-selector">
          <label><input type="checkbox" class="day-check" value="1"> L</label>
          <label><input type="checkbox" class="day-check" value="2"> M</label>
          <label><input type="checkbox" class="day-check" value="3"> X</label>
          <label><input type="checkbox" class="day-check" value="4"> J</label>
          <label><input type="checkbox" class="day-check" value="5"> V</label>
          <label><input type="checkbox" class="day-check" value="6"> S</label>
          <label><input type="checkbox" class="day-check" value="0"> D</label>
        </div>

        <div class="row-inputs" style="display:flex; gap:10px; margin-top:8px;">
          <input type="time" id="course-start-time" required style="flex:1;">
          <input type="time" id="course-end-time" required style="flex:1;">
        </div>

        <div style="margin-top:10px;">
          <label style="font-size:0.85rem; color:var(--text-dim); display:block; margin-bottom:4px;">Inicio del Curso</label>
          <input type="date" id="course-start-date" required style="width:100%;">
        </div>

        <div style="margin-top:10px; margin-bottom:10px;">
          <label style="font-size:0.85rem; color:var(--text-dim); display:block; margin-bottom:4px;">Duración (Semanas)</label>
          <input type="number" id="course-weeks" value="16" min="1" max="52" required style="width:100%; margin-bottom:6px;">
          
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button type="button" onclick="setSemanas(4)" style="padding:4px 8px; font-size:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;">⚡ 4 sem</button>
            <button type="button" onclick="setSemanas(8)" style="padding:4px 8px; font-size:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;">📘 8 sem</button>
            <button type="button" onclick="setSemanas(16)" style="padding:4px 8px; font-size:0.75rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;">🎓 16 sem</button>
          </div>
        </div>

        <div style="margin-bottom:12px;">
          <label style="font-size:0.85rem; color:var(--text-dim); display:block; margin-bottom:4px;">Color distintivo</label>
          <input type="color" id="course-color" value="#3b82f6" style="width:100%; height:40px; border:none; border-radius:6px; cursor:pointer;">
        </div>

        <button type="submit" class="btn-primary">Guardar Curso</button>
      </form>

    </div>
  </div>

  <!-- Barra de Navegación Inferior -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="cambiarVista('hoy', this)">Hoy</button>
    <button class="nav-btn" onclick="cambiarVista('tareas', this)">Tareas</button>
    <button class="nav-btn" onclick="cambiarVista('cursos', this)">Cursos</button>
    <button class="nav-btn" onclick="cambiarVista('notas', this)">Notas</button>
  </nav>

  <!-- SDKs de Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

      projectId: "agenda-academica-f2111",
      storageBucket: "agenda-academica-f2111.firebasestorage.app",
      messagingSenderId: "893970697850",

    window.db = firebase.firestore();
  </script>

  <script src="app.js"></script>
</body>
</html>
